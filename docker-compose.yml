  # ------------------------------------------------------------------
  # APPS — blocks-utilities
  # ------------------------------------------------------------------
  utilities-api:
    <<: *app-defaults
    profiles: [apps, utilities]
    image: blocksos/blocks-utilities-api:${UTILITIES_TAG:-latest}
    container_name: utilities-api
    depends_on: *app-deps
