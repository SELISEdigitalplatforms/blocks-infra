# Application catalog consumed by the deployment compose generator.
# Fill in the domain, then point the compose templating at this file.
#
# Top-level: base domain + Let's Encrypt contact. Subdomains are built as
#   <subdomain>.<domain>  -> e.g. iam.example.com
# Workers are NOT exposed via nginx; they only consume RabbitMQ.
#
# Each service's image is described structurally:
#   image:
#     registry: blocksos          # Docker Hub namespace (public)
#     repository: blocks-os-api   # blocks-<svc>-<api|worker>
#     tag: ${OS_TAG}              # commit SHA; -api/-worker of a svc share it.
#                                 # blank => run.sh resolves the newest pushed
#                                 # tag at deploy time. No `latest` exists upstream.
# Full ref = <registry>/<repository>:<tag>, e.g. blocksos/blocks-os-api:<sha>.

domain: example.com
letsencrypt_email: ops@example.com

# Optional: extra env shared by every service (rare — base infra env comes from .env).
# shared_env:
#   SOME_GLOBAL_KEY: value

services:
  # -------- blocks-os --------
  - name: os-api
    image:
      registry: blocksos
      repository: blocks-os-api
      tag: ${OS_TAG}        # blank -> newest pushed tag, resolved at deploy
    kind: web
    subdomain: os
    port: 8080
    profile: os
    # env:
    #   BlocksSecret__SomeOsSpecificKey: changeme

  - name: os-worker
    image:
      registry: blocksos
      repository: blocks-os-worker
      tag: ${OS_TAG}        # blank -> newest pushed tag, resolved at deploy
    kind: worker
    profile: os

  # -------- blocks-iam --------
  - name: iam-api
    image:
      registry: blocksos
      repository: blocks-iam-api
      tag: ${IAM_TAG}        # blank -> newest pushed tag, resolved at deploy
